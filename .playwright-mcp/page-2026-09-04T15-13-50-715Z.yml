        - paragraph [ref=e74]: This PR replaces an inline, in-repo Karate-based staging API test suite with a delegation to an external QA-owned pipeline (qa-core-framework). All 217 files under api_test/ that made up the old test suite, config, and mocks are deleted; a new trigger_qa_api_test.sh script is added that gathers PR context, decides whether to skip the run, builds a payload describing the changed files, and triggers/polls the external qa-core-framework Bitbucket pipeline. bitbucket-pipelines.yml is updated to call this script instead of running the old inline steps, marks the step as non-blocking (on-fail ignore) during rollout, and wires it into the pronto pipeline.
